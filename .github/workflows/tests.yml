# The two suites the repository already runs: `cargo test`, then the plugin
# tests. Nothing here is a new gate — it is `pnpm test` on a machine that knows
# nothing about this one.
#
# The one real problem CI has to solve is the harness. The plugin tests import
# `@deepseek-ai/cordis` and `@deepseek-ai/schemastery`, and two suites read
# YAML through the harness's own copy, so a runner with no harness fails a test
# that passes on a developer's machine. Installing the published `@deepseek-ai/dsh`
# into a scratch prefix and pointing `DSH_PROFILE_MODULES` at its module tree
# reproduces what a real install looks like: the postinstall copies the packages
# it needs from that tree, and the tests resolve the rest from the same one.
#
# The runner is `macos-latest`, and that was learned by running this workflow
# for the first time. `ubuntu-latest` is cheaper, and the suites do not launch
# the sidecar — they check the vendored PocketBase archive's pin and hashes, not
# the binary. But the crate depends on Tauri, whose Linux backend needs GTK,
# WebKit and pkg-config development packages the runner does not carry, so
# `cargo clippy` and `cargo test` both die in `glib-sys`'s build script before
# reaching a line of this repository. The pinned archive is `darwin_arm64` as
# well, so macOS is the only runner where the pin and the platform agree.
#
# This still proves nothing about the app *running*: no window opens and no
# sidecar starts here. `pnpm verify:*` does that, and it needs a real desktop.
# macOS runners are free for public repositories, so the choice costs nothing.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with the lockfile's lockfileVersion; pnpm 10 refuses an older
  # store format rather than migrating it silently.
  PNPM_VERSION: 10.33.2

jobs:
  test:
    runs-on: macos-latest
    # A cold macOS Rust build of the Tauri crate takes far longer than the
    # suites themselves; `Swatinem/rust-cache` makes every later run short.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # The harness paths are exported to the whole job rather than set in a
      # job-level `env`, where the `runner` context is not available.
      #
      # `npm install --prefix` puts the module tree at `<prefix>/node_modules`,
      # which is exactly the tree the harness looks for, so both variables name
      # that one directory: `DSH_PROFILE_MODULES` is what the postinstall copies
      # from *and* what the tests resolve through (see `harnessPath`).
      - name: Choose the harness prefix
        run: |
          echo "DSH_HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          echo "DSH_PROFILE_MODULES=$RUNNER_TEMP/harness/node_modules" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # cargo is set up before the install purely so the toolchain is ready by
      # the time `pnpm test` runs; the install's own scripts do not need it.
      # This action installs `rustfmt` and `clippy` alongside it.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The style is pinned by src-tauri/rustfmt.toml. Checking it here is what
      # keeps it from drifting: a formatter nobody runs is a formatter nobody
      # has.
      - name: Check formatting
        run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml

      # Lints are denied rather than reported, because a warning nobody fails
      # on is a warning that accumulates. `--all-targets` covers the test
      # modules too, which is where the lints have actually been.
      - name: Lint
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      # A real published install of the harness, in a prefix of its own: the
      # repository must not gain a dependency on it, since it is not what the
      # app ships against.
      #
      # The version is pinned, and the pin is not cosmetic. The harness is
      # published as release candidates and the suites import it by module path,
      # so `latest` moving is enough to turn this gate red without a line of this
      # repository changing — which is how this workflow first failed. Bumping
      # the number is a deliberate act.
      #
      # `dsh` installs `dsh-tools` inside its own `node_modules`: npm keeps it
      # nested there, while `tests/memory.test.mjs` reads
      # `$DSH_PROFILE_MODULES/@deepseek-ai/dsh-tools/lib/index.js` directly and
      # `scripts/link-harness-modules.mjs` looks for it at the tree root. A link
      # gives both of them that path without moving the package, so its own
      # imports still resolve where npm resolved them. Asking npm for
      # `dsh-tools` as a second root dependency instead is not an option: it
      # makes peer resolution fail outright, which is how this fix was found.
      - name: Install the harness
        run: |
          npm install --prefix "$DSH_HARNESS" --no-audit --no-fund @deepseek-ai/dsh@0.1.5-rc.2
          if [ ! -e "$DSH_PROFILE_MODULES/@deepseek-ai/dsh-tools" ]; then
            nested=$(find "$DSH_HARNESS/node_modules" -type d -path '*/@deepseek-ai/dsh-tools' | head -1)
            test -n "$nested"
            ln -s "$nested" "$DSH_PROFILE_MODULES/@deepseek-ai/dsh-tools"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm install` copies the harness modules the tests import, but it is
      # deliberately tolerant: on a machine with no usable harness it prints one
      # note and carries on, because only the memory suites need one. Without
      # this step, a harness that stops shipping a module shows up as five
      # suites failing on module resolution, which names the symptom and not the
      # cause. Assert the contract where the cause is still visible.
      - name: Check the harness contract
        run: |
          for module in cordis schemastery dsh-tools; do
            if [ ! -d "node_modules/@deepseek-ai/$module" ]; then
              echo "::error::node_modules/@deepseek-ai/$module is missing: the harness tree at $DSH_PROFILE_MODULES does not satisfy the three modules the suites import (see PACKAGES in scripts/link-harness-modules.mjs)"
              exit 1
            fi
          done

      # `pnpm test` is the repository's own gate: pretest runs `cargo test`,
      # which dumps src-tauri/target/test-tmp/launcher-sample.patch.yml, and the
      # JavaScript suites parse that file. Running `node --test` alone would
      # silently skip those assertions.
      - name: Run the suites
        run: pnpm test

      - name: Report what ran
        if: always()
        run: |
          echo "harness tree: $(ls "$DSH_PROFILE_MODULES" 2>/dev/null | head -3 | tr '\n' ' ')"
          echo "copied: $(ls node_modules/@deepseek-ai 2>/dev/null | tr '\n' ' ')"
